<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines -->
  <line x1="12" y1="48" x2="52" y2="48" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="12" y1="34" x2="52" y2="34" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />
  <line x1="12" y1="20" x2="52" y2="20" stroke="#334155" stroke-width="1.5" stroke-dasharray="2 2" />
  
  <!-- Bars -->
  <rect x="16" y="38" width="6" height="10" rx="2" fill="#38bdf8" opacity="0.6" />
  <rect x="26" y="28" width="6" height="20" rx="2" fill="#38bdf8" opacity="0.8" />
  <rect x="36" y="32" width="6" height="16" rx="2" fill="#38bdf8" opacity="0.7" />
  <rect x="46" y="18" width="6" height="30" rx="2" fill="#10b981" />

  <!-- Trend Arrow Line -->
  <path d="M16 36 L28 26 L38 30 L48 16" fill="none" stroke="url(#lineGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="40,16 48,16 48,24" fill="none" stroke="#10b981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
